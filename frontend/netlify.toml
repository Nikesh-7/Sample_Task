[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/*.js"
[headers.values]
Content-Type = "application/javascript; charset=utf-8"

[[headers]]git add .
git commit -m "Fix frontend backend connection"
git push origin main
for = "/*.mjs"
[headers.values]
Content-Type = "application/javascript; charset=utf-8"

[[headers]]
for = "/*.css"
[headers.values]
Content-Type = "text/css; charset=utf-8"